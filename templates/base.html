{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Anomaly Detector{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{% url 'dashboard' %}">AnomalyOps</a>
        <nav class="nav">
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'upload_csv' %}">CSV Upload</a>
            <a href="{% url 'simulator' %}">Simulator</a>
            <a href="/api/readings/">API</a>
        </nav>
    </header>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="message {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}

    <main class="page">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
